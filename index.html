<script>

if(window.__DATA){SCN=window.__DATA.scenarios||SCN;T=window.__DATA.terms||T;NEWS=window.__DATA.news||NEWS}
NEWS.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const $=s=>document.getElementById(s);

const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const IV=[0,1,3,7,14,30,60];

// 용어 자동 연결 (구형 사파리 호환: 정규식 lookbehind 미사용)
function mentions(t,txt){
  const name=String(t.t).split("(")[0];if(name.length>=3&&txt.includes(name))return true;
  const toks=[t.k].concat(String(t.k).split("/").filter(x=>x.length>=2));
  const isAN=c=>!!c&&/[A-Za-z0-9.]/.test(c);
  return toks.some(x=>{let i=txt.indexOf(x);while(i>=0){const pv=txt[i-1],nx=txt[i+x.length],nk=txt.slice(i+x.length,i+x.length+2);if(!isAN(pv)&&(!isAN(nx)||nk==="kV"))return true;i=txt.indexOf(x,i+1)}return false});
}
function enrich(s){(s.steps||[]).forEach(st=>{
  const txt=st.q+" "+(st.o||[]).join(" ")+" "+(s.intro||"");
  st.l=(st.l||[]).filter(k=>T[k]);
  st.h=Object.keys(T).filter(k=>mentions(T[k],txt)).sort((a,b)=>T[a].k.localeCompare(T[b].k));
  Object.keys(T).forEach(k=>{if(st.l.length<9&&!st.l.includes(k)&&(st.h.includes(k)||mentions(T[k],st.e||"")))st.l.push(k)});
});return s}
SCN.forEach(enrich);
Object.keys(T).forEach(k=>{T[k].l=(T[k].l||[]).filter(x=>T[x])});

// 기록

// ---------- 클로드 계정 동기화 (로그인한 본인만, 나머지는 이 기기에만 저장)
let CLOUD=null,cloudState="local",pushT=null;
function mergeD(a,b){
  const o=JSON.parse(JSON.stringify(a));
  Object.entries(b.done||{}).forEach(([k,v])=>{if(!o.done[k]||v<o.done[k])o.done[k]=v});
  ["rv","cd"].forEach(f=>Object.entries(b[f]||{}).forEach(([k,v])=>{if(!o[f][k]||String(v.due)>String(o[f][k].due))o[f][k]=v}));
  o.days=[...new Set((o.days||[]).concat(b.days||[]))].sort().slice(-400);
  Object.assign(o.nr,b.nr||{});
  Object.entries(b.wn||{}).forEach(([k,v])=>{o.wn[k]=Math.max(o.wn[k]||0,v)});
  o.st={a:Math.max(o.st.a||0,(b.st||{}).a||0),c:Math.max(o.st.c||0,(b.st||{}).c||0)};
  if(b.pref&&(!o.pref||(b.pref.at||0)>(o.pref.at||0)))o.pref=b.pref;
  return o;
}
function cloudPush(){
  if(!CLOUD)return;clearTimeout(pushT);
  pushT=setTimeout(()=>{CLOUD.set({d:JSON.parse(JSON.stringify(D)),at:Date.now()}).then(()=>setCloud("on")).catch(e=>{if(e&&e.code==="invalid_argument"){CLOUD=null;setCloud("local")}else setCloud("err")})},1200);
}

async function sbContent(){
  try{const {data,error}=await SB.from("content_items").select("kind,data").order("created_at",{ascending:true}).limit(2000);if(error||!data)return;
    let ch=false;const ids=new Set(SCN.map(x=>x.id)),nids=new Set(NEWS.map(x=>x.id));
    data.filter(r=>r.kind==="term"&&r.data&&r.data.id).forEach(r=>{const d=Object.assign({},r.data);const id=d.id;delete d.id;if(!T[id]){T[id]=d;ch=true}});
    Object.keys(T).forEach(k=>{T[k].l=(T[k].l||[]).filter(x=>T[x])});
    data.filter(r=>r.kind==="scn"&&r.data&&r.data.id&&!ids.has(r.data.id)).forEach(r=>{SCN.push(enrich(r.data));ch=true});
    data.filter(r=>r.kind==="news"&&r.data&&r.data.id&&!nids.has(r.data.id)).forEach(r=>{NEWS.push(r.data);ch=true});
    if(ch){NEWS.sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!R)render()}
  }catch(e){}
}
async function sbInit(){sbContent();if(getTok())await sbPull();else setCloud("login")}
async function sbPull(){
  const tok=getTok();if(!tok){setCloud("login");return}
  try{const {data,error}=await SB.rpc("app_load",{p_token:tok});
    if(error){if(/no_session/.test(error.message||"")){setTok(null);SBUSER=null;CLOUD=null;setCloud("login");return}throw error}
    SBUSER={name:data.username};
    if(data.data&&typeof data.data==="object"&&data.data.done){D=mergeD(D,data.data);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
    CLOUD={set:async v=>{const {error:e2}=await SB.rpc("app_save",{p_token:getTok(),p_data:v.d});if(e2)throw e2}};
    setCloud("on");cloudPush();if(!R)render();
  }catch(e){setCloud("err")}
}

async function sbAuth(kind){
  const u=($("sbUser").value||"").trim().toLowerCase(),pw=$("sbPw").value||"";const msg=$("sbMsg");
  if(!u||!pw){msg.textContent="아이디와 비밀번호를 입력해 주세요.";return}
  msg.textContent=kind==="up"?"가입하는 중…":"로그인하는 중…";
  try{const {data,error}=await SB.rpc(kind==="up"?"app_signup":"app_login",{p_user:u,p_pw:pw});
    if(error)throw error;setTok(data);close();await sbPull();
  }catch(e){msg.textContent=KO_ERR(String(e&&e.message||e))}
}

async function cloudInit(){
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,300));
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!u)return;const id=await u.id();if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");const snap=await ref.get();
    if(snap.exists){const d=(snap.data()||{}).d;if(d&&typeof d==="object"){D=mergeD(D,d);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}}
    CLOUD=ref;setCloud("on");cloudPush();if(!R)render();
  }catch(e){setCloud("local")}
}

function finish(p,ok,extra){
  const hb=$("hint");if(hb)hb.hidden=true;
  D.st.a=(D.st.a||0)+1;if(ok)D.st.c=(D.st.c||0)+1;

  if(R.onAnswer)R.onAnswer(p,ok);touch();
  const W=p.w||(p.key&&stepOf(p.key)?stepOf(p.key).st.w:null);
  const why=!ok&&(p.type||"mc")==="mc"&&R.pick!=null&&W&&W[R.pick]?`<div class="field"><span class="lbl">내가 고른 보기</span><p><b>${esc(p.o[R.pick])}</b> — ${esc(W[R.pick])}</p></div>`:"";
  $("fb").innerHTML=(extra||"")+`<div class="fb"><span class="res ${ok?"r":"w"}">${ok?"맞아요":"아니에요"}</span>${why}<p>${esc(p.e)}</p>${(p.l||[]).length?`<span class="lbl">관련 용어 눌러서 자세히</span>${chips(p.l)}`:""}${!ok&&R.kind!=="review"&&p.key?`<span class="lbl">이 문제는 오답노트와 복습에 담아 뒀어요.</span>`:""}</div>
    <button class="btn main" id="next" style="margin-top:12px">${R.i+1<R.items.length?"다음":"결과 보기"}</button>`;

function flowLines(s){const out=[];for(const raw of String(s.chain||"").split("\n")){const x=raw.trim();if(!x)continue;if(/^\[|^교훈/.test(x))break;out.push(x.replace(/^→\s*/,""))}return out.slice(0,5)}

const PAIRS=[["uat","sat"],["loop","sbo"],["ct","vt"],["edg","aac"],["50","51"],["27","59"],["red","div"],["87","86"],["pwr","phwr"],["dc","ups"],["1e","non1e"],["ind","div"],["sfc","ccf"],["40","46"],["21","87"],["mt","uat"],["scs","sg"],["79","86"],["la","64"],["seq","sync"]];
function mask(t,txt){let s=String(txt);[t.t.split("(")[0],t.k].forEach(w=>{if(w&&w.length>=2)s=s.split(w).join("○○")});return s}
function pairItems(n){
  const ok=PAIRS.filter(p=>T[p[0]]&&T[p[1]]);const items=[];
  shuffle(ok.slice()).slice(0,n).forEach(([a,b])=>{const [x,y]=Math.random()<.5?[a,b]:[b,a];const X=T[x],Y=T[y];
    items.push({q:`"${mask(X,X.s)}" 어느 쪽 설명일까요?`,o:[`${X.k} ${X.k===X.t?"":X.t}`.trim(),`${Y.k} ${Y.k===Y.t?"":Y.t}`.trim()],a:0,
      e:`${X.k===X.t?X.t:X.k+"("+X.t+")"}는 ${X.s}\n${Y.k===Y.t?Y.t:Y.k+"("+Y.t+")"}는 ${Y.s}`,l:[x,y],label:"헷갈리는 짝"})});

  const N=Object.fromEntries(d.N.map(n=>[n.id,n]));const lv=new Set(),q=[];

    case"pairGo":return run({kind:"pair",title:"헷갈리는 짝 구별",items:pairItems(10),end:()=>endBasic("짝 구별 끝","review")});
    case"quickGo":return run({kind:"quick",title:"1분 문제",items:quickItems(),onAnswer:(p,ok)=>{if(!ok&&p.key&&stepOf(p.key)){D.rv[p.key]={due:addDays(today(),1),n:0};save()}},end:()=>endBasic("1분 문제 끝","review")});
    case"flipCard":case"flipBtn":card.flip=!card.flip;return termsTab();
    case"moreCards":card=null;return termsTab();
    case"exp":{$("code").value=exportCode();$("codeMsg").textContent="코드를 만들었어요. 길게 눌러 전체 선택한 뒤 복사하세요.";try{navigator.clipboard.writeText($("code").value).then(()=>{$("codeMsg").textContent="코드를 복사했어요. 새 기기에서 '코드로 불러오기'에 붙여 넣으세요."}).catch(()=>{$("code").select()})}catch(_){$("code").select()}return}
    case"imp":{const ok=importCode($("code").value||"");$("codeMsg").textContent=ok?"기록을 불러왔어요.":"코드가 올바르지 않아요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요.";if(ok){render();const d=document.querySelector("details");if(d){d.open=true;$("codeMsg").textContent="기록을 불러왔어요."}}return}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;dictList()}if(e.target.id==="scnQ"){scnQ=e.target.value;scnList()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("sheetHost").innerHTML)return close();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("box")){e.preventDefault();sheet(e.target.dataset.t)}
});
render();
if(SB)sbInit();else cloudInit();
setTimeout(()=>{if(!D.pref&&!$("sheetHost").innerHTML)prefSheet(true)},1200);
</script>
