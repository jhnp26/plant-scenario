# Supabase 무료 플랜은 일주일간 요청이 없으면 일시정지됨 → 3일마다 공개 읽기 요청 하나를 보내 깨워 둠.
name: keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 읽기 요청
        run: |
          URL=$(grep -o 'url:"[^"]*"' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'key:"[^"]*"' config.js | cut -d'"' -f2)
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$URL/rest/v1/content_items?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
